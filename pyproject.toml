[project]
name = "backrooms-server"
version = "0.1.0"
description = "FastMCP server with streamable HTTP"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "fastmcp>=2.0",
    "uvicorn>=0.30.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "psycopg>=3.0",
    "python-dotenv>=1.0",
    "alembic>=1.0",
    "mako>=1.3.0,<2.0",
    "fastapi>=0.136.1",
]

[dependency-groups]
dev = [
    "alembic>=1.0",
]

[tool.uv]
